<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EE Student Portal</title>
    <style>
        :root {
            --primary: #f5b041; /* Golden Yellow */
            --bg-color: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --shadow: 0 4px 20px rgba(245, 176, 65, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: linear-gradient(145deg, #1a1a1a, #121212);
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(245, 176, 65, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }

        .login-btn {
            background: linear-gradient(145deg, #f5b041, #d68910);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 176, 65, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 176, 65, 0.6);
        }

        /* Dashboard Screen */
        #dashboard-screen { display: none; }

        .card {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .card h2 { color: var(--primary); margin-top: 0; }

        .badge {
            display: inline-block;
            background: rgba(245, 176, 65, 0.2);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* Announcements Grid */
        #announcements-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .announcement-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-top: 3px solid var(--primary);
        }

        .announcement-date { font-size: 0.8rem; color: var(--text-muted); }
        
        .loading { text-align: center; color: var(--primary); font-size: 1.2rem; margin: 20px 0; }
        
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .logout-btn:hover { background: #333; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>EE Student Portal</h1>
    </header>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="container">
        <h2 style="margin-bottom: 30px;">Sign in with your Smail Account</h2>
        <button id="google-login-btn" class="login-btn">Sign in with Google</button>
        <p id="login-error" style="color: #ff6b6b; margin-top: 15px;"></p>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="container">
        <div class="header-controls">
            <div>
                <h2 id="welcome-message" style="margin: 0;">Welcome!</h2>
                <p id="student-roll" style="color: var(--text-muted); margin: 5px 0 0 0;"></p>
            </div>
            <button id="logout-btn" class="logout-btn">Log Out</button>
        </div>

        <div class="card">
            <h2>Your Timetable Batches</h2>
            <div id="batch-info">
                <!-- Batch info injected here via JS -->
            </div>
        </div>

        <div class="card">
            <h2>Department Announcements</h2>
            <div id="loading-spinner" class="loading">Fetching latest announcements...</div>
            <div id="announcements-container">
                <!-- Announcements injected here via JS -->
            </div>
        </div>
    </div>

    <!-- Firebase v11 SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        // Switched to signInWithPopup to fix the redirect loop on hosted domains
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        // YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDJK_3XlS9kNn995eX82GB8RBBxYioVTiM",
            authDomain: "elec-portal-88871.firebaseapp.com",
            projectId: "elec-portal-88871",
            storageBucket: "elec-portal-88871.firebasestorage.app",
            messagingSenderId: "1007788491395",
            appId: "1:1007788491395:web:9c2efc0ebf92b7867b11b6"
        };

        // YOUR LIVE APPS SCRIPT URL
        const ANNOUNCEMENTS_URL = "https://script.google.com/macros/s/AKfycbxpt_JdfHTHFQiflqiVtpd3g7HM6zwjotSQ_cJxN3e5EPHNO7NDelB21U1EtnJEdYstEw/exec";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // UI Elements
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('login-error');

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is logged in
                loginScreen.style.display = 'none';
                dashboardScreen.style.display = 'block';
                
                const email = user.email;
                document.getElementById('welcome-message').innerText = `Welcome, ${user.displayName.split(' ')[0]}!`;
                
                // Extract Roll Number (Assuming smail format: rollnumber@smail.iitm.ac.in)
                const rollNumberStr = email.split('@')[0].replace(/\D/g, ''); // Extracts only digits
                const rollNumber = parseInt(rollNumberStr, 10);
                
                if (rollNumber) {
                    document.getElementById('student-roll').innerText = `Roll Number: ${email.split('@')[0].toUpperCase()}`;
                    calculateBatches(rollNumber);
                } else {
                    document.getElementById('student-roll').innerText = email;
                    document.getElementById('batch-info').innerHTML = "<p>Could not detect roll number from email.</p>";
                }

                fetchAnnouncements();
            } else {
                // User is logged out
                loginScreen.style.display = 'flex';
                dashboardScreen.style.display = 'none';
            }
        });

        // Login Action (Using Popup)
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Login Error:", error);
                errorMsg.innerText = "Error logging in: " + error.message;
            });
        });

        // Logout Action
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Batch Calculation Logic
        function calculateBatches(roll) {
            // General Batch (1-79 = Batch 1, 80-158 = Batch 2)
            let generalBatch = "Unknown";
            if (roll >= 1 && roll <= 79) generalBatch = "Batch 1";
            else if (roll >= 80 && roll <= 158) generalBatch = "Batch 2";

            // Programming Batch (Modulo 3)
            let progBatchNumber = roll % 3;
            if (progBatchNumber === 0) progBatchNumber = 3;
            let progBatch = `Programming Batch ${progBatchNumber}`;

            const html = `
                <span class="badge">General: ${generalBatch}</span>
                <span class="badge">${progBatch}</span>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 15px;">Your timetable will follow the schedule for these batches.</p>
            `;
            document.getElementById('batch-info').innerHTML = html;
        }

        // Fetch Announcements from Google Sheet Web App
        async function fetchAnnouncements() {
            try {
                const response = await fetch(ANNOUNCEMENTS_URL);
                const data = await response.json();
                
                const container = document.getElementById('announcements-container');
                document.getElementById('loading-spinner').style.display = 'none';
                
                if (data.length === 0) {
                    container.innerHTML = "<p>No recent announcements found.</p>";
                    return;
                }

                let html = '';
                // data format assumes array of arrays: [Date, Subject, Category, Snippet, DriveLink]
                // skipping row 0 (headers)
                for (let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if (!row[0]) continue;
                    
                    const date = new Date(row[0]).toLocaleDateString();
                    const subject = row[1];
                    const category = row[2];
                    const snippet = row[3];
                    const link = row[4];

                    html += `
                        <div class="announcement-item">
                            <div class="badge" style="margin-bottom: 5px;">${category}</div>
                            <h3 style="margin: 10px 0; font-size: 1.1rem;">${subject}</h3>
                            <p class="announcement-date">${date}</p>
                            <p style="font-size: 0.95rem; line-height: 1.4;">${snippet}</p>
                            ${link ? `<a href="${link}" target="_blank" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">View Attachment</a>` : ''}
                        </div>
                    `;
                }
                container.innerHTML = html;

            } catch (error) {
                console.error("Error fetching announcements:", error);
                document.getElementById('loading-spinner').innerText = "Failed to load announcements. Please check backend.";
            }
        }
    </script>
</body>
</html>
